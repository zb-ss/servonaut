version: 2
updates:
  # Workflows and the local composite action pin actions to full commit SHAs
  # with a version comment; Dependabot bumps both together.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-standalone-cli"
    schedule:
      interval: weekly
    # Action bumps change CI only, so they stay out of the release notes.
    labels:
      - dependencies
      - github_actions
      - skip-changelog
    groups:
      github-actions:
        patterns:
          - "*"
