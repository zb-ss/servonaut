name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - master
      - 'feature/desktop/**'

# The test jobs install third-party packages; keep the token they can reach
# read-only and out of the checkout's Git configuration.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Install optional cloud-provider extras so tests that import the
        # provider SDKs (hcloud, ovh) execute their real code paths instead
        # of failing with ModuleNotFoundError.
        run: python -m pip install -e ".[test,hetzner,ovh,mcp]"

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest --tb=short -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest --cov=servonaut --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  desktop-host:
    name: desktop host / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[test,desktop-test]"

      - name: Run desktop tests
        env:
          # A missing host dependency fails the run instead of skipping the
          # host, authentication and Origin tests.
          SERVONAUT_REQUIRE_DESKTOP_TESTS: "1"
        run: python -m pytest --tb=short -q tests/desktop

  e2e:
    name: end-to-end journeys / Python 3.12
    runs-on: ubuntu-latest
    # The suite targets about five minutes including the install; the limit
    # only stops a hung run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The provider extras let the MCP journey list every tool.
        run: python -m pip install -e ".[test,e2e,hetzner,ovh]"

      - name: Cache published releases
        # The upgrade journeys install earlier releases. The suite never
        # reaches the network, so the wheels are downloaded before it runs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-cache/releases
          key: e2e-releases-${{ hashFiles('pyproject.toml', 'e2e/tools/fetch_previous_release.py') }}
          restore-keys: e2e-releases-

      - name: Fetch published releases
        # Reuses cached wheels whose SHA-256 still matches the one PyPI
        # publishes and downloads the rest, checked the same way. If PyPI
        # cannot be reached, an intact cache made for this version is kept.
        run: python e2e/tools/fetch_previous_release.py

      - name: Run end-to-end journeys
        # Its own pytest process (see e2e/__init__.py). Journeys that share
        # one server declare an xdist group, hence --dist loadgroup. With the
        # release cache named explicitly, a missing release fails the upgrade
        # journeys instead of skipping them.
        env:
          SERVONAUT_E2E_RELEASE_CACHE: ${{ github.workspace }}/.e2e-cache/releases
        run: >-
          python -m pytest e2e --tb=short -q
          -m "e2e_pr and not e2e_quarantine"
          -n auto --dist loadgroup

      - name: Upload failure artifacts
        # Public: every fixture is neutral, and paths and credentials are scrubbed.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-artifacts
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  native-runtime:
    name: ${{ matrix.os }} / Python 3.12 focused runtime
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[test,hetzner,ovh,mcp]"

      - name: Run native runtime tests
        run: >-
          python -m pytest --tb=short -q
          tests/test_runtime.py
          tests/test_relay_control.py
          tests/test_relay_lock.py
          tests/test_relay_manager.py
          tests/test_process_control.py
          tests/test_terminal_service_windows.py
          tests/test_terminal_wrapper_sweep.py
          tests/test_mcp_installer.py
          tests/test_update_service.py
          tests/test_distribution_dependency_setup.py
          tests/test_runtime_integration.py
          tests/packaging/test_standalone_artifact_filesystem_windows.py
          tests/packaging/test_standalone_sbom_normalize.py::test_native_windows_generation_normalizes_full_syft_file_component_path
