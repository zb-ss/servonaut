name: Desktop probe

on:
  push:
    branches: [master, 'feature/desktop/**']
    paths:
      - 'src/**'
      - 'scripts/desktop_probe/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-probe.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/desktop_probe/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.os }} / ${{ matrix.renderer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            renderer: gtk
            python: local/desktop-probe-venv/bin/python
          - os: ubuntu-24.04
            renderer: gtk
            python: local/desktop-probe-venv/bin/python
          - os: windows-2025
            renderer: edgechromium
            python: local/desktop-probe-venv/Scripts/python.exe
          - os: macos-15-intel
            renderer: cocoa
            python: local/desktop-probe-venv/bin/python
          - os: macos-15
            renderer: cocoa
            python: local/desktop-probe-venv/bin/python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'

      - name: Install GTK and create matching Python environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages local/desktop-probe-venv

      - name: Create Python environment
        if: runner.os != 'Linux'
        run: python -m venv local/desktop-probe-venv

      - name: Install isolated probe dependencies
        run: |
          "${{ matrix.python }}" -m pip install --upgrade pip
          "${{ matrix.python }}" -m pip install -r scripts/desktop_probe/requirements.txt

      - name: Install browser engines and Linux libraries
        if: runner.os == 'Linux'
        run: '"${{ matrix.python }}" -m playwright install --with-deps chromium webkit'

      - name: Install browser engines
        if: runner.os != 'Linux'
        run: '"${{ matrix.python }}" -m playwright install chromium webkit'

      - name: Check sockets, browsers and native GTK window
        if: runner.os == 'Linux'
        run: xvfb-run -a "${{ matrix.python }}" -m scripts.desktop_probe.check --browser chromium --browser webkit --native --renderer "${{ matrix.renderer }}"

      - name: Check sockets, browsers and native window
        if: runner.os != 'Linux'
        run: '"${{ matrix.python }}" -m scripts.desktop_probe.check --browser chromium --browser webkit --native --renderer "${{ matrix.renderer }}"'

      - name: Upload sanitized results and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-probe-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            local/desktop-probe-results/**/report.json
            local/desktop-probe-results/**/chromium/*.png
            local/desktop-probe-results/**/webkit/*.png
