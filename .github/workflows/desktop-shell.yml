name: Desktop Shell qualification

on:
  push:
    branches: [master, 'feature/desktop/**']
    paths:
      - 'src/**'
      - 'packaging/deb/**'
      - 'packaging/desktop_shell/**'
      - 'packaging/standalone_cli/**'
      - 'scripts/desktop_shell/**'
      - 'scripts/distribution/**'
      - 'scripts/standalone_cli/**'
      - '.github/actions/setup-standalone-cli/**'
      - 'tests/packaging/**'
      - 'tests/desktop/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-shell.yml'
  pull_request:
    branches:
      - master
      - 'feature/desktop/**'
    paths:
      - 'src/**'
      - 'packaging/deb/**'
      - 'packaging/desktop_shell/**'
      - 'packaging/standalone_cli/**'
      - 'scripts/desktop_shell/**'
      - 'scripts/distribution/**'
      - 'scripts/standalone_cli/**'
      - '.github/actions/setup-standalone-cli/**'
      - 'tests/packaging/**'
      - 'tests/desktop/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: desktop contract
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install contract test dependencies
        run: python -m pip install -e ".[test,mcp]" "pyinstaller==6.22.3" "textual-serve==1.1.3"
      - name: Verify workflow and packaging contracts
        run: python -m pytest -q tests/packaging/test_desktop_*.py

  qualify:
    name: desktop (${{ matrix.target }})
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-ubuntu-22.04
            runner: ubuntu-22.04
            python-architecture: x64
          - target: windows-x64
            runner: windows-2022
            python-architecture: x64
          - target: macos-x64
            runner: macos-15-intel
            python-architecture: x64
          - target: macos-arm64
            runner: macos-15
            python-architecture: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}

      - name: Prepare qualification paths
        id: paths
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP}" ]]; then
            echo "runner temporary directory is unavailable" >&2
            exit 1
          fi
          PYTHON_PATH="$(python -c 'import sys; print(sys.executable)')"
          BASE_TEMP="${RUNNER_TEMP}/servonaut-desktop-${TARGET}-${GITHUB_RUN_ID}"
          export BASE_TEMP
          "${PYTHON_PATH}" -I -c '
          import os
          from pathlib import Path

          base = Path(os.environ["BASE_TEMP"])
          try:
              base.mkdir(mode=0o700, parents=False, exist_ok=False)
              for name in ("wheel-tools", "qualification", "evidence", "upload", "screenshots", "forward"):
                  (base / name).mkdir(mode=0o700)
          except OSError:
              raise SystemExit("qualification directories could not be created")
          '
          VERSION="$("${PYTHON_PATH}" -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          {
            echo "python-path=${PYTHON_PATH}"
            echo "base-temp=${BASE_TEMP}"
            echo "wheel-tools-dir=${BASE_TEMP}/wheel-tools"
            echo "qualification-dir=${BASE_TEMP}/qualification"
            echo "build-dir=${BASE_TEMP}/build"
            echo "evidence-dir=${BASE_TEMP}/evidence"
            echo "upload-dir=${BASE_TEMP}/upload"
            echo "screenshot-dir=${BASE_TEMP}/screenshots"
            echo "forward-dir=${BASE_TEMP}/forward"
            echo "product-version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      # Linux builds PyGObject and pycairo from source against the host GLib,
      # bundles only their typelibs, and runs the packaged window on a virtual
      # display. The package list mirrors scripts/desktop_shell/linux_abi.py.
      - name: Install Linux GTK build and window packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgirepository1.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 \
            pkg-config libcairo2-dev libffi-dev gir1.2-girepository-2.0 gir1.2-gtk-3.0 \
            xvfb xauth imagemagick

      - name: Build verified wheel with locked tools
        id: wheel
        uses: ./.github/actions/setup-standalone-cli
        with:
          python-path: ${{ steps.paths.outputs.python-path }}
          checkout-path: ${{ github.workspace }}
          temporary-directory: ${{ steps.paths.outputs.wheel-tools-dir }}

      - name: Prepare hash-locked qualification environment
        id: qualification-env
        env:
          TARGET: ${{ matrix.target }}
          SELECTED_PYTHON: ${{ steps.paths.outputs.python-path }}
          ROOT: ${{ steps.paths.outputs.qualification-dir }}
        run: |
          set -euo pipefail
          VENV="${ROOT}/venv"
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${SELECTED_PYTHON}" -m venv "${VENV}"
          QUALIFIED_PYTHON="${VENV}/bin/python"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then QUALIFIED_PYTHON="${VENV}/Scripts/python.exe"; fi
          if ! "${QUALIFIED_PYTHON}" -m pip --isolated install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes \
            -r "${GITHUB_WORKSPACE}/packaging/standalone_cli/requirements/qualification-tools-${TARGET}.txt" \
            >"${ROOT}/qualification-install.log" 2>&1; then
            tail -n 40 "${ROOT}/qualification-install.log" >&2
            exit 1
          fi
          "${QUALIFIED_PYTHON}" -m pip check
          echo "python-path=${QUALIFIED_PYTHON}" >> "${GITHUB_OUTPUT}"

      - name: Build internal desktop onedir payload
        id: build
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          WHEEL_PATH: ${{ steps.wheel.outputs.wheel-path }}
          TARGET: ${{ matrix.target }}
          BUILD_DIR: ${{ steps.paths.outputs.build-dir }}
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -m scripts.desktop_shell.build \
            --wheel "${WHEEL_PATH}" \
            --target "${TARGET}" \
            --output-dir "${BUILD_DIR}"
          echo "payload-dir=${BUILD_DIR}/servonaut-desktop" >> "${GITHUB_OUTPUT}"
          echo "metadata-dir=${BUILD_DIR}/build-metadata" >> "${GITHUB_OUTPUT}"

      - name: Inspect desktop onedir payload
        id: inspect
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          PAYLOAD_DIR: ${{ steps.build.outputs.payload-dir }}
          METADATA_DIR: ${{ steps.build.outputs.metadata-dir }}
          TARGET: ${{ matrix.target }}
          PRODUCT_VERSION: ${{ steps.paths.outputs.product-version }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.evidence-dir }}
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -m scripts.desktop_shell.inspect \
            --payload-root "${PAYLOAD_DIR}" \
            --build-metadata "${METADATA_DIR}" \
            --target "${TARGET}" \
            --product-version "${PRODUCT_VERSION}" \
            --output "${EVIDENCE_DIR}/inspection-report-${TARGET}.json"

      # --selftest runs the packaged GUI self-test headlessly: desktop imports,
      # bundled resources, the presence of the voice bundle and one
      # authenticated session through the real child. Opening the native
      # window needs a display, so --selftest-window stays off on these runners.
      - name: Run policy-bound smoke checks
        id: smoke
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          PAYLOAD_DIR: ${{ steps.build.outputs.payload-dir }}
          METADATA_DIR: ${{ steps.build.outputs.metadata-dir }}
          TARGET: ${{ matrix.target }}
          PRODUCT_VERSION: ${{ steps.paths.outputs.product-version }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.evidence-dir }}
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -m scripts.desktop_shell.smoke_artifact \
            --payload-root "${PAYLOAD_DIR}" \
            --build-metadata "${METADATA_DIR}" \
            --target "${TARGET}" \
            --product-version "${PRODUCT_VERSION}" \
            --evidence-dir "${EVIDENCE_DIR}" \
            --selftest

      # Opens the packaged window the way a user starts it, on a virtual X
      # display with an isolated HOME. It passes once the page has opened the
      # authenticated session, so a window that stays blank fails it. Linux
      # only: the macOS runners give this job no display.
      - name: Run packaged window smoke
        id: window-smoke
        if: runner.os == 'Linux'
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          PAYLOAD_DIR: ${{ steps.build.outputs.payload-dir }}
          TARGET: ${{ matrix.target }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.evidence-dir }}
          SCREENSHOT_DIR: ${{ steps.paths.outputs.screenshot-dir }}
        run: |
          set -euo pipefail
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            "${QUALIFIED_PYTHON}" -m scripts.desktop_shell.window_smoke \
            --payload-root "${PAYLOAD_DIR}" \
            --target "${TARGET}" \
            --evidence-dir "${EVIDENCE_DIR}" \
            --screenshot "${SCREENSHOT_DIR}/desktop-window-${TARGET}.png"

      # Forward qualification on the newer LTS: the payload built above,
      # packaged as the .deb and installed in a clean Ubuntu 24.04 container
      # with nothing but its declared Depends, must open its window the same
      # way. The container keeps the payload inside this job. WebKit sandboxes
      # its web processes with bubblewrap, which needs the user namespaces
      # Docker's default seccomp and AppArmor profiles deny.
      - name: Run packaged window smoke on Ubuntu 24.04
        id: window-smoke-forward
        if: runner.os == 'Linux'
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          PAYLOAD_DIR: ${{ steps.build.outputs.payload-dir }}
          TARGET: ${{ matrix.target }}
          PRODUCT_VERSION: ${{ steps.paths.outputs.product-version }}
          FORWARD_DIR: ${{ steps.paths.outputs.forward-dir }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.evidence-dir }}
          SCREENSHOT_DIR: ${{ steps.paths.outputs.screenshot-dir }}
          FORWARD_IMAGE: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
        run: |
          set -euo pipefail
          mkdir "${FORWARD_DIR}/deb" "${FORWARD_DIR}/out"
          trap 'cp "${FORWARD_DIR}"/out/*.json "${EVIDENCE_DIR}/" 2>/dev/null || true; cp "${FORWARD_DIR}"/out/*.png "${SCREENSHOT_DIR}/" 2>/dev/null || true' EXIT
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -m scripts.distribution.package_deb \
            --payload-dir "${PAYLOAD_DIR}" \
            --output-dir "${FORWARD_DIR}/deb" \
            --version "${PRODUCT_VERSION}" \
            --maintainer "Servonaut qualification <qualification@example.com>" \
            --filename servonaut.deb
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=1g \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${FORWARD_DIR}/deb:/deb:ro" \
            --volume "${FORWARD_DIR}/out:/out" \
            --workdir /src \
            "${FORWARD_IMAGE}" \
            bash scripts/desktop_shell/forward_window_smoke.sh \
            /deb/servonaut.deb "${TARGET}" /out "$(id -u):$(id -g)"

      - name: Prepare sanitized non-executable evidence
        id: sanitize
        if: always() && steps.paths.outputs.base-temp != ''
        env:
          EVIDENCE_DIR: ${{ steps.paths.outputs.evidence-dir }}
          UPLOAD_DIR: ${{ steps.paths.outputs.upload-dir }}
          TARGET: ${{ matrix.target }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          INSPECT_STATUS: ${{ steps.inspect.outcome }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
          WINDOW_SMOKE_STATUS: ${{ steps.window-smoke.outcome }}
          WINDOW_SMOKE_FORWARD_STATUS: ${{ steps.window-smoke-forward.outcome }}
        run: |
          set -euo pipefail
          if [ -d "${EVIDENCE_DIR}" ]; then
            find "${EVIDENCE_DIR}" -type f -name "*.json" -exec cp {} "${UPLOAD_DIR}/" \;
          fi
          # Write summary status JSON
          cat <<EOF > "${UPLOAD_DIR}/qualification-status-${TARGET}.json"
          {
            "schema_version": 1,
            "target": "${TARGET}",
            "build_status": "${BUILD_STATUS}",
            "inspect_status": "${INSPECT_STATUS}",
            "smoke_status": "${SMOKE_STATUS}",
            "window_smoke_status": "${WINDOW_SMOKE_STATUS}",
            "window_smoke_forward_status": "${WINDOW_SMOKE_FORWARD_STATUS}"
          }
          EOF

      - name: Upload sanitized qualification evidence
        id: upload
        if: always() && steps.paths.outputs.base-temp != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-qualification-${{ matrix.target }}
          path: ${{ steps.paths.outputs.upload-dir }}/*.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false

      # A photograph of the virtual display, taken once the window's session
      # opened, or when it did not.
      - name: Upload packaged window screenshot
        if: always() && runner.os == 'Linux' && steps.paths.outputs.base-temp != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-window-${{ matrix.target }}
          path: ${{ steps.paths.outputs.screenshot-dir }}/*.png
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

      - name: Cleanup build material and executables
        id: cleanup
        if: always()
        env:
          BASE_TEMP: ${{ steps.paths.outputs.base-temp }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_TEMP}" ] && [ -d "${BASE_TEMP}" ]; then
            rm -rf "${BASE_TEMP}"
          fi

      - name: Require successful qualification
        if: always()
        env:
          WHEEL_STATUS: ${{ steps.wheel.outcome }}
          QUALIFICATION_ENV_STATUS: ${{ steps.qualification-env.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          INSPECT_STATUS: ${{ steps.inspect.outcome }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
          WINDOW_SMOKE_STATUS: ${{ steps.window-smoke.outcome }}
          WINDOW_SMOKE_FORWARD_STATUS: ${{ steps.window-smoke-forward.outcome }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
          CLEANUP_STATUS: ${{ steps.cleanup.outcome }}
        run: |
          test "${WHEEL_STATUS}" = "success"
          test "${QUALIFICATION_ENV_STATUS}" = "success"
          test "${BUILD_STATUS}" = "success"
          test "${INSPECT_STATUS}" = "success"
          test "${SMOKE_STATUS}" = "success"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            test "${WINDOW_SMOKE_STATUS}" = "success"
            test "${WINDOW_SMOKE_FORWARD_STATUS}" = "success"
          fi
          test "${UPLOAD_STATUS}" = "success"
          test "${CLEANUP_STATUS}" = "success"
