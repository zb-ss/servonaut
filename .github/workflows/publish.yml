name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Two releases in one day means every user is prompted to upgrade twice,
  # and the update prompt has no snooze. Fixes ride a weekly train instead.
  # To ship anyway (user-blocking damage only: data loss, corruption, crash
  # on launch, broken upgrade path, security), set the repository variable
  # ALLOW_SAME_DAY_RELEASE to "true" and re-run this workflow.
  cadence:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a second release on the same day
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_TAG: ${{ github.event.release.tag_name }}
          THIS_PUBLISHED: ${{ github.event.release.published_at }}
          OVERRIDE: ${{ vars.ALLOW_SAME_DAY_RELEASE }}
        run: |
          set -euo pipefail
          today="${THIS_PUBLISHED%%T*}"
          echo "This release: $THIS_TAG published $THIS_PUBLISHED (day $today)"

          if [ "${OVERRIDE:-}" = "true" ]; then
            echo "::warning::ALLOW_SAME_DAY_RELEASE is set - skipping the cadence check."
            exit 0
          fi

          # Drafts have no published_at; prereleases still prompt users, so
          # they count. Compare dates in UTC, which is what the API returns.
          clash=$(gh api --paginate "repos/$REPO/releases" \
            --jq ".[] | select(.draft == false)
                      | select(.tag_name != \"$THIS_TAG\")
                      | select(.published_at != null)
                      | select((.published_at | split(\"T\")[0]) == \"$today\")
                      | .tag_name")

          if [ -n "$clash" ]; then
            echo "::error::A release already went out today ($today): $(echo "$clash" | tr '\n' ' ')."
            echo "Nothing was published to PyPI. Delete this release and re-tag on the next"
            echo "release train (Thursday), or set ALLOW_SAME_DAY_RELEASE=true for a genuine"
            echo "user-blocking hotfix and re-run."
            exit 1
          fi
          echo "No other release today - proceeding."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Match ci.yml — install the optional provider SDKs so tests that
        # import hcloud / ovh / mcp run their real code paths instead of
        # failing with ModuleNotFoundError. Without this, the same 8
        # hetzner tests that block ci would block the release-time publish.
        run: pip install -e ".[test,hetzner,ovh,mcp]"

      - name: Run tests
        run: pytest --tb=short -q

  publish:
    needs: [cadence, test]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The version in the committed server.json is informational; the
      # release tag is the source of truth at publish time.
      - name: Set version in server.json from release tag
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Registry validation fetches the package from PyPI (version must
      # exist and the README must contain the mcp-name marker), so wait
      # for the index to serve the release published by the previous job.
      - name: Wait for PyPI to serve the new version
        run: |
          VERSION="${TAG#v}"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/servonaut/${VERSION}/json" > /dev/null; then
              echo "PyPI serves servonaut ${VERSION}"
              exit 0
            fi
            echo "Attempt ${i}: not available yet, retrying in 10s..."
            sleep 10
          done
          echo "PyPI never served servonaut ${VERSION}" >&2
          exit 1
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (DNS, servonaut.dev)
        run: ./mcp-publisher login dns --domain servonaut.dev --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
