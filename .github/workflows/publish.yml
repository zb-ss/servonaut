name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Match ci.yml — install the optional provider SDKs so tests that
        # import hcloud / ovh / mcp run their real code paths instead of
        # failing with ModuleNotFoundError. Without this, the same 8
        # hetzner tests that block ci would block the release-time publish.
        run: pip install -e ".[test,hetzner,ovh,mcp]"

      - name: Run tests
        run: pytest --tb=short -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
