name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      revision: ${{ steps.policy.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the stable release and package versions
        id: policy
        run: |
          set -euo pipefail
          python .github/scripts/release-policy.py check-event "$GITHUB_EVENT_PATH" \
            --ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"

  # Two releases in one day means every user is prompted to upgrade twice,
  # and the update prompt has no snooze. Fixes ride a weekly train instead.
  # To ship anyway (user-blocking damage only: data loss, corruption, crash
  # on launch, broken upgrade path, security), set the repository variable
  # ALLOW_SAME_DAY_RELEASE to "true" and re-run this workflow.
  cadence:
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a second release on the same day
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_TAG: ${{ github.event.release.tag_name }}
          THIS_PUBLISHED: ${{ github.event.release.published_at }}
          OVERRIDE: ${{ vars.ALLOW_SAME_DAY_RELEASE }}
        run: |
          set -euo pipefail
          today="${THIS_PUBLISHED%%T*}"
          echo "This release: $THIS_TAG published $THIS_PUBLISHED (day $today)"

          if [ "${OVERRIDE:-}" = "true" ]; then
            echo "::warning::ALLOW_SAME_DAY_RELEASE is set - skipping the cadence check."
            exit 0
          fi

          # Every published release counts towards the daily limit, including
          # previews. Compare UTC dates, which is what the API returns.
          clash=$(gh api --paginate "repos/$REPO/releases" \
            --jq ".[] | select(.draft == false)
                      | select(.tag_name != \"$THIS_TAG\")
                      | select(.published_at != null)
                      | select((.published_at | split(\"T\")[0]) == \"$today\")
                      | .tag_name")

          if [ -n "$clash" ]; then
            echo "::error::A release already went out today ($today): $(echo "$clash" | tr '\n' ' ')."
            echo "Nothing was published to PyPI. Delete this release and re-tag on the next"
            echo "release train (Thursday), or set ALLOW_SAME_DAY_RELEASE=true for a genuine"
            echo "user-blocking hotfix and re-run."
            exit 1
          fi
          echo "No other release today - proceeding."

  # Phase 6: publishing must follow a verified release candidate. The gate is
  # staged behind the REQUIRE_RELEASE_CANDIDATE repository variable so the
  # weekly release train is unaffected until the candidate workflow has
  # produced evidence for a real release. When enabled, the candidate evidence
  # attached to the release is verified against the release tag and the
  # validated release commit, and every release file it names is downloaded
  # and checked against the recorded size and SHA-256, before any publishing
  # job runs.
  candidate:
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_CANDIDATE: ${{ vars.REQUIRE_RELEASE_CANDIDATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.REQUIRE_CANDIDATE == 'true'
        with:
          python-version: "3.12"
      - name: Require candidate verification when enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_TAG: ${{ github.event.release.tag_name }}
          REVISION: ${{ needs.eligibility.outputs.revision }}
        run: |
          set -euo pipefail
          if [ "${REQUIRE_CANDIDATE:-}" != "true" ]; then
            echo "::notice::Release-candidate verification is not required yet."
            exit 0
          fi
          WORK="$(mktemp -d)"
          gh release download "$THIS_TAG" --repo "$REPO" \
            --pattern candidate-evidence.json --dir "$WORK" \
            || { echo "::error::No candidate-evidence.json is attached to $THIS_TAG; refusing to publish an unverified release."; exit 1; }
          # Fetch exactly the release files the evidence names, so check-publish
          # can compare their sizes and digests with the candidate.
          mkdir "$WORK/artifacts"
          jq -r '.artifacts[].filename' "$WORK/candidate-evidence.json" > "$WORK/artifact-names"
          while IFS= read -r name; do
            gh release download "$THIS_TAG" --repo "$REPO" \
              --pattern "$name" --dir "$WORK/artifacts" \
              || { echo "::error::A release file named by the candidate evidence is not attached to $THIS_TAG."; exit 1; }
          done < "$WORK/artifact-names"
          python -m pip install --quiet -e .
          python scripts/distribution/release_candidate.py check-publish \
            --evidence "$WORK/candidate-evidence.json" --tag "$THIS_TAG" \
            --commit "$REVISION" --artifacts-dir "$WORK/artifacts" \
            --channel stable

  test:
    needs: [eligibility, candidate]
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Match ci.yml — install the optional provider SDKs so tests that
        # import hcloud / ovh / mcp run their real code paths instead of
        # failing with ModuleNotFoundError. Without this, the same 8
        # hetzner tests that block ci would block the release-time publish.
        run: pip install -e ".[test,hetzner,ovh,mcp]"

      - name: Run tests
        run: pytest --tb=short -q

  publish:
    needs: [eligibility, cadence, test]
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  mcp-registry:
    needs: [eligibility, publish]
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false

      # The version in the committed server.json is informational; the
      # release tag is the source of truth at publish time.
      - name: Set version in server.json from release tag
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Registry validation fetches the package from PyPI (version must
      # exist and the README must contain the mcp-name marker), so wait
      # for the index to serve the release published by the previous job.
      - name: Wait for PyPI to serve the new version
        run: |
          VERSION="${TAG#v}"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/servonaut/${VERSION}/json" > /dev/null; then
              echo "PyPI serves servonaut ${VERSION}"
              exit 0
            fi
            echo "Attempt ${i}: not available yet, retrying in 10s..."
            sleep 10
          done
          echo "PyPI never served servonaut ${VERSION}" >&2
          exit 1
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Pinned release, verified before extraction. The checksum is the
      # linux_amd64 entry of the release's registry_<version>_checksums.txt;
      # update both values together.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          if [ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]; then
            echo "::error::The pinned mcp-publisher checksum is for linux_amd64 runners."
            exit 1
          fi
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict -
          tar xzf "$archive" mcp-publisher

      - name: Authenticate to MCP Registry (DNS, servonaut.dev)
        run: ./mcp-publisher login dns --domain servonaut.dev --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
