name: Release

# Cuts Servonaut releases in two stages, so every release is installed and
# tested as a pre-release before any user is offered it.
#
# candidate (Monday, and on demand): picks the next version from the
#   conventional-commit prefixes since the last published stable release,
#   opens a short-lived release/X.Y.Z branch from master, sets the version to
#   X.Y.ZrcN there, tags vX.Y.ZrcN and creates a GitHub pre-release. The
#   publish workflow uploads it to PyPI, where pip and pipx install it only
#   when asked for pre-releases. While release/X.Y.Z is open, each run cuts
#   the next candidate from the head of that branch instead, so fixes
#   cherry-picked onto it are tested as a new candidate.
#
# final (Thursday, and on demand): promotes the latest candidate once it is
#   approved in the release-approval environment. Only the version changes
#   from the tested candidate: it becomes X.Y.Z, tagged vX.Y.Z, with a normal
#   GitHub release that the publish workflow ships to PyPI and the MCP
#   registry. Master's version is raised to X.Y.Z and the release branch is
#   deleted. Without an open candidate there is nothing to promote and no
#   release that week. A rejected or expired approval publishes nothing.
#
# `dry_run` reports what either stage would do without touching anything,
# and works without the token below.
#
# Needs a RELEASE_TOKEN repository secret: a fine-grained personal access
# token with Contents: read/write on this repository. The built-in token can
# neither push to the protected default branch nor trigger another workflow —
# a release it created would never reach PyPI.

on:
  schedule:
    # GitHub cron is UTC only: 09:47 GMT, 10:47 BST. The "Choose the stage"
    # step maps each schedule to its stage.
    - cron: "47 8 * * 1"   # Monday: cut a candidate
    - cron: "47 8 * * 4"   # Thursday: promote the candidate
  workflow_dispatch:
    inputs:
      stage:
        description: "candidate = cut the next pre-release; final = promote the latest candidate after approval"
        type: choice
        default: candidate
        options: [candidate, final]
      bump:
        description: "Version bump for a new release branch (auto = commits since the last published stable release)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      dry_run:
        description: "Report what would be released without doing anything"
        type: boolean
        default: false
      draft:
        description: "Create the GitHub release as a draft, to polish the notes before publishing"
        type: boolean
        default: false

# The built-in token only reads. Every write (push, tag, release) uses
# RELEASE_TOKEN, which the mutating jobs' checkouts persist for the push.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    # actions: read lets the job confirm the approval environment's rules.
    permissions:
      contents: read
      actions: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      dry_run: ${{ steps.stage.outputs.dry_run }}
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      candidate: ${{ steps.plan.outputs.candidate }}
      branch: ${{ steps.plan.outputs.branch }}
      base: ${{ steps.plan.outputs.base }}
      last_tag: ${{ steps.plan.outputs.last_tag }}
    env:
      BUMP: ${{ inputs.bump || 'auto' }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Choose the stage
        id: stage
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "47 8 * * 1") stage=candidate ;;
              "47 8 * * 4") stage=final ;;
              *) echo "::error::No release stage is mapped to this schedule."; exit 1 ;;
            esac
          else
            stage="$REQUESTED"
          fi
          case "$stage" in
            candidate|final) ;;
            *) echo "::error::The release stage must be candidate or final."; exit 1 ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Stage: $stage" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the prerequisites
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — nothing will be pushed, tagged or released."
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::RELEASE_TOKEN is not set. Add a fine-grained personal access token with Contents: read/write on this repository as a repository secret, or run with dry_run."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::Releases are cut from master only (this run is on $GITHUB_REF_NAME)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # every branch, tag and commit, to find the release branch
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases" \
            | python3 .github/scripts/release-policy.py "$STAGE" --bump "$BUMP" \
                --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

      # A job that names an environment nobody configured creates it without
      # protection rules, and would run without waiting for anyone. Refuse to
      # ask for approval unless a reviewer is actually required.
      - name: Require a reviewer for the promotion
        if: steps.plan.outputs.action == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers="$(gh api "repos/$REPO/environments/release-approval" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' \
            2> /dev/null || true)"
          case "$reviewers" in
            ''|*[!0-9]*|0)
              echo "::error::The release-approval environment must require a reviewer before a candidate can be promoted. Add one under Settings > Environments."
              exit 1
              ;;
          esac
          echo "The release-approval environment requires a reviewer."

      - name: Require the candidate on PyPI
        if: steps.plan.outputs.action == 'promote'
        env:
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          if ! curl -sf --retry 3 "https://pypi.org/pypi/servonaut/${CANDIDATE#v}/json" > /dev/null; then
            echo "::error::$CANDIDATE is not on PyPI, so it cannot have been installed and tested. Check its publish run."
            exit 1
          fi
          echo "PyPI serves $CANDIDATE."

  candidate:
    needs: plan
    if: >-
      needs.plan.outputs.stage == 'candidate'
      && (needs.plan.outputs.action == 'new' || needs.plan.outputs.action == 'next')
      && needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DRAFT: ${{ inputs.draft == true }}
      ACTION: ${{ needs.plan.outputs.action }}
      TAG: ${{ needs.plan.outputs.tag }}
      BRANCH: ${{ needs.plan.outputs.branch }}
      BASE: ${{ needs.plan.outputs.base }}
      LAST: ${{ needs.plan.outputs.last_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The release branch may carry older tooling; always use this run's.
      - name: Keep this run's release tooling
        run: cp .github/scripts/release-policy.py "$RUNNER_TEMP/release-policy.py"

      - name: Cut the candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/release-policy.py"
          v="${TAG#v}"
          git switch --detach "$BASE"
          python3 "$policy" set-version "$v" > /dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $v"
          git tag "$TAG"
          # A new branch must not exist yet; an open one must still be where
          # it was planned. Branch and tag land together or not at all.
          expected=""
          [ "$ACTION" = "next" ] && expected="$BASE"
          git push --atomic --force-with-lease="refs/heads/$BRANCH:$expected" \
            origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"

          draft_flag=""
          [ "$DRAFT" = "true" ] && draft_flag="--draft"
          gh release create "$TAG" --title "$TAG" --prerelease --verify-tag \
            --generate-notes --notes-start-tag "$LAST" $draft_flag
          if [ -n "$draft_flag" ]; then
            echo "Draft pre-release $TAG created on $BRANCH — publish it to upload it to PyPI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pre-release $TAG created on $BRANCH — publishing to PyPI follows. Try it without touching an existing install: \`pipx run --spec 'servonaut==$v' servonaut\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The pause for a person: the maintainer reviews this job in the
  # release-approval environment. Rejecting it, or letting it expire, leaves
  # the promotion below skipped, so nothing is tagged or published.
  approval:
    needs: plan
    if: >-
      needs.plan.outputs.stage == 'final'
      && needs.plan.outputs.action == 'promote'
      && needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: release-approval
    permissions: {}
    steps:
      - name: Record the approval
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: echo "Approved promoting $CANDIDATE to $TAG." >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [plan, approval]
    if: needs.approval.result == 'success' && needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DRAFT: ${{ inputs.draft == true }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
      BRANCH: ${{ needs.plan.outputs.branch }}
      BASE: ${{ needs.plan.outputs.base }}
      LAST: ${{ needs.plan.outputs.last_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Keep this run's release tooling
        run: cp .github/scripts/release-policy.py "$RUNNER_TEMP/release-policy.py"

      # Approval can take days. Promote only the candidate that was approved,
      # and only while it is still the latest one on the release branch.
      - name: Confirm the approved candidate is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now="$(gh api --paginate "repos/$REPO/releases" \
            | python3 "$RUNNER_TEMP/release-policy.py" final)"
          for expected in "action=promote" "candidate=$CANDIDATE" "tag=$TAG" "base=$BASE"; do
            if ! grep -qxF "$expected" <<< "$now"; then
              echo "::error::The release branch changed while $CANDIDATE waited for approval. Nothing was promoted; test the latest candidate and run the final stage again."
              exit 1
            fi
          done
          echo "Promoting $CANDIDATE, unchanged since it was approved."

      - name: Refuse if a release already went out today
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          today="$(date -u +%F)"
          # Only stable releases count: pre-releases and previews are never
          # offered to people on a stable version.
          shipped="$(gh api --paginate "repos/$REPO/releases" \
            --jq ".[] | select(.draft == false) | select(.prerelease == false)
                      | select(.published_at != null)
                      | select((.published_at | split(\"T\")[0]) == \"$today\") | .tag_name" \
            | tr '\n' ' ')"
          if [ -n "$shipped" ]; then
            # One release per day: the app prompts every user to upgrade on
            # every launch, with no snooze. A scheduled run simply waits; a
            # person pressing the button should see why nothing happened.
            msg="A release already went out today ($today): $shipped. Waiting for the next train."
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::notice::$msg"; exit 0
            fi
            echo "::error::$msg"; exit 1
          fi
          echo "Nothing shipped today — clear to release."
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Promote the candidate
        if: steps.cadence.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/release-policy.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --detach "$BASE"
          python3 "$policy" set-version "$VERSION" > /dev/null
          git commit -am "chore: bump version to $VERSION"
          git tag "$TAG"
          # The stable release is the tested candidate with only its version changed.
          changed="$(git diff --name-only "$CANDIDATE" "$TAG" | tr '\n' ' ')"
          if [ "$changed" != "pyproject.toml src/servonaut/__init__.py " ]; then
            echo "::error::$TAG would differ from $CANDIDATE in more than its version."
            exit 1
          fi

          # Between releases, master carries the latest release's version.
          refs=("refs/tags/$TAG" ":refs/heads/$BRANCH")
          git switch --detach origin/master
          raised="$(python3 "$policy" set-version "$VERSION" --only-if-newer)"
          if grep -qx "changed=true" <<< "$raised"; then
            git commit -am "chore: bump version to $VERSION"
            refs+=("HEAD:refs/heads/master")
          fi
          # Tag, master and the branch deletion land together or not at all,
          # and the branch goes only while it still holds the approved candidate.
          git push --atomic --force-with-lease="refs/heads/$BRANCH:$BASE" origin "${refs[@]}"

          draft_flag=""
          [ "$DRAFT" = "true" ] && draft_flag="--draft"
          gh release create "$TAG" --title "$TAG" --verify-tag \
            --generate-notes --notes-start-tag "$LAST" $draft_flag
          if [ -n "$draft_flag" ]; then
            echo "Draft release $TAG created — publish it to ship." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released $TAG — publishing to PyPI and the MCP registry follows." >> "$GITHUB_STEP_SUMMARY"
          fi
