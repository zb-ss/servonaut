name: Standalone CLI qualification

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - master
      - 'feature/desktop/**'

permissions:
  contents: read

jobs:
  contract:
    name: standalone contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install contract test dependencies
        run: python -m pip install -e ".[test,mcp]"
      - name: Verify workflow contract
        run: python -m pytest -q tests/packaging/test_standalone_workflow_contract.py

  qualify:
    name: standalone (${{ matrix.target }})
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-ubuntu-22.04
            runner: ubuntu-22.04
            python-architecture: x64
          - target: windows-x64
            runner: windows-2022
            python-architecture: x64
          - target: macos-x64
            runner: macos-15-intel
            python-architecture: x64
          - target: macos-arm64
            runner: macos-15
            python-architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - name: Assert target runtime
        id: runtime
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PYTHON_PATH="$(python -c 'import sys; print(sys.executable)')"
          "${PYTHON_PATH}" - <<'PY'
          import os
          import platform
          import struct
          import sys

          target = os.environ["TARGET"]
          expected = {
              "linux-x64-ubuntu-22.04": ("linux", "x86_64"),
              "windows-x64": ("win32", "x86_64"),
              "macos-x64": ("darwin", "x86_64"),
              "macos-arm64": ("darwin", "arm64"),
          }[target]
          machine = platform.machine().casefold().replace("amd64", "x86_64")
          if sys.version_info[:2] != (3, 12) or struct.calcsize("P") != 8:
              raise SystemExit("runtime assertion failed")
          if sys.platform == "win32" and sys.version_info < (3, 12, 4):
              raise SystemExit("runtime assertion failed")
          if (sys.platform, machine) != expected:
              raise SystemExit("target assertion failed")
          if target == "linux-x64-ubuntu-22.04":
              facts = {}
              with open(os.environ.get("SERVONAUT_OS_RELEASE_PATH", "/etc/os-release"), encoding="utf-8") as handle:
                  for line in handle:
                      key, separator, value = line.strip().partition("=")
                      if separator:
                          facts[key] = value.strip().strip("\"'")
              if facts.get("ID") != "ubuntu" or facts.get("VERSION_ID") != "22.04":
                  raise SystemExit("Linux baseline assertion failed")
          PY
          echo "python-path=${PYTHON_PATH}" >> "${GITHUB_OUTPUT}"
      - name: Prepare wheel work parent
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SELECTED_PYTHON: ${{ steps.runtime.outputs.python-path }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP}" ]]; then
            echo "runner temporary directory is unavailable" >&2
            exit 1
          fi
          WORK_PARENT="${RUNNER_TEMP}/servonaut-wheel-${TARGET}-${GITHUB_RUN_ID}"
          export WORK_PARENT
          "${SELECTED_PYTHON}" -I -c '
          import os
          from pathlib import Path

          try:
              Path(os.environ["WORK_PARENT"]).mkdir(
                  mode=0o700, parents=False, exist_ok=False
              )
          except OSError:
              raise SystemExit("wheel work parent could not be created")
          '
      - name: Prepare verified wheel tools
        id: wheel
        uses: ./.github/actions/setup-standalone-cli
        with:
          python-path: ${{ steps.runtime.outputs.python-path }}
          checkout-path: ${{ github.workspace }}
          temporary-directory: ${{ runner.temp }}/servonaut-wheel-${{ matrix.target }}-${{ github.run_id }}
      - name: Prepare qualification environment
        id: qualification-env
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SELECTED_PYTHON: ${{ steps.runtime.outputs.python-path }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP}" ]]; then
            echo "runner temporary directory is unavailable" >&2
            exit 1
          fi
          ROOT="${RUNNER_TEMP}/servonaut-qualification-${TARGET}-${GITHUB_RUN_ID}"
          VENV="${ROOT}/venv"
          export ROOT
          "${SELECTED_PYTHON}" -I -c '
          import os
          from pathlib import Path

          try:
              Path(os.environ["ROOT"]).mkdir(mode=0o700, parents=False, exist_ok=False)
          except OSError:
              raise SystemExit("qualification setup root could not be created")
          '
          echo "root=${ROOT}" >> "${GITHUB_OUTPUT}"
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${SELECTED_PYTHON}" -m venv "${VENV}"
          QUALIFIED_PYTHON="${VENV}/bin/python"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then QUALIFIED_PYTHON="${VENV}/Scripts/python.exe"; fi
          "${QUALIFIED_PYTHON}" -m pip --isolated install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes \
            -r "${GITHUB_WORKSPACE}/packaging/standalone_cli/requirements/qualification-tools-${TARGET}.txt" \
            >"${ROOT}/qualification-install.log" 2>&1
          "${QUALIFIED_PYTHON}" -m pip check >"${ROOT}/qualification-check.log" 2>&1
          "${QUALIFIED_PYTHON}" -c "import jsonschema, mcp" >"${ROOT}/qualification-import.log" 2>&1
          echo "python-path=${QUALIFIED_PYTHON}" >> "${GITHUB_OUTPUT}"
      - name: Verify Windows PyInstaller diagnostics
        if: matrix.target == 'windows-x64'
        shell: bash
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          QUALIFICATION_SETUP_ROOT: ${{ steps.qualification-env.outputs.root }}
        run: |
          set -euo pipefail
          if [[ -z "${QUALIFIED_PYTHON:-}" || ! -f "${QUALIFIED_PYTHON}" || -z "${QUALIFICATION_SETUP_ROOT:-}" || ! -d "${QUALIFICATION_SETUP_ROOT}" ]]; then
            echo "Windows diagnostic environment is unavailable" >&2
            exit 1
          fi
          if ! env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -c '
          import importlib.metadata
          import sys
          import PyInstaller
          from PyInstaller.building.api import EXE
          from PyInstaller.compat import pywintypes
          from PyInstaller.compat import win32api
          from PyInstaller.exceptions import ImportErrorWhenRunningHook
          from PyInstaller.exceptions import PythonLibraryNotFoundError
          from PyInstaller.isolated._parent import SubprocessDiedError

          if (
              sys.platform != "win32"
              or importlib.metadata.version("pyinstaller") != "6.22.3"
              or not isinstance(pywintypes.error, type)
          ):
              raise SystemExit("Windows PyInstaller diagnostic preflight failed")
          ' >"${QUALIFICATION_SETUP_ROOT}/windows-pyinstaller-preflight.log" 2>&1; then
            echo "Windows PyInstaller diagnostic stage failed: preflight" >&2
            exit 1
          fi
          echo "Windows PyInstaller diagnostic stage passed: preflight"
          PYTEST_CONFIG="${QUALIFICATION_SETUP_ROOT}/windows-pytest.ini"
          printf '[pytest]\n' >"${PYTEST_CONFIG}"
          DIAGNOSTIC_FAILURE=0
          read_diagnostic_outcome() {
            local stage="$1"
            local outcome
            local checkpoint
            local error_type
            local observation
            local outcome_log="${QUALIFICATION_SETUP_ROOT}/windows-pyinstaller-outcome-${stage}.log"
            if observation="$(env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
              "${QUALIFIED_PYTHON}" -c '
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          RECORD_PREFIX = "windows-pyinstaller-outcome-"
          MAX_RECORD_BYTES = 4096
          STAGES = frozenset({"share-lock", "isolated-child", "hook-import", "python-library"})
          OUTCOMES = frozenset({
              "fixture-setup-failed",
              "copied-spec-preflight",
              "copied-spec-generic-failure",
              "expected-classifier",
              "other-known-classifier",
              "unexpected-child-exit",
          })
          CHECKPOINTS = frozenset({
              "outer-before-copy",
              "outer-before-create",
              "outer-before-resource-call",
              "outer-before-cause-type",
              "outer-before-winerror-type",
              "outer-before-winerror-value",
              "outer-before-close",
              "outer-before-unlink",
              "outer-complete",
              "parent-before-copied-environment",
              "parent-before-child-launch",
              "parent-before-process-create",
              "parent-after-child-launch",
              "parent-before-result-classification",
              "child-bootstrap",
              "child-import-pyinstaller-api",
              "child-import-pyinstaller-compat",
              "child-import-pyinstaller-exceptions",
              "child-import-pyinstaller-isolated",
              "child-environment",
              "child-share-copy",
              "child-share-create",
              "child-spec-dispatch",
              "child-spec-analysis",
              "child-spec-exe",
              "child-spec-finished",
              "child-before-close",
              "child-before-unlink",
              "child-complete",
              "child-timeout",
              "child-stderr-overflow",
              "child-observer-invalid",
              "child-interpreter-fatal",
              "child-script-parse",
              "child-startup-no-stderr",
              "child-startup-unclassified",
          })
          ERROR_TYPES = frozenset({
              "os-error",
              "file-not-found",
              "file-exists",
              "permission-error",
              "not-a-directory",
              "is-a-directory",
              "import-error",
              "module-not-found",
              "attribute-error",
              "type-error",
              "value-error",
              "runtime-error",
              "assertion-error",
              "system-exit",
              "none",
              "other",
              "unavailable",
          })

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate outcome key")
                  result[key] = value
              return result

          if len(sys.argv) != 2 or sys.argv[1] not in STAGES:
              raise ValueError("invalid diagnostic stage")
          root_value = os.environ.get("QUALIFICATION_SETUP_ROOT")
          if not root_value:
              raise ValueError("missing diagnostic root")
          stage = sys.argv[1]
          record = Path(root_value) / f"{RECORD_PREFIX}{stage}.json"
          record_status = record.lstat()
          if (
              not stat.S_ISREG(record_status.st_mode)
              or record.is_symlink()
              or record_status.st_size <= 0
              or record_status.st_size > MAX_RECORD_BYTES
          ):
              raise ValueError("invalid diagnostic outcome record")
          raw = json.loads(record.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
          if (
              not isinstance(raw, dict)
              or set(raw) != {"schema_version", "stage", "outcome", "checkpoint", "error_type"}
              or type(raw.get("schema_version")) is not int
              or raw["schema_version"] != 2
              or type(raw.get("stage")) is not str
              or raw["stage"] != stage
              or type(raw.get("outcome")) is not str
              or raw["outcome"] not in OUTCOMES
              or type(raw.get("checkpoint")) is not str
              or raw["checkpoint"] not in CHECKPOINTS
              or type(raw.get("error_type")) is not str
              or raw["error_type"] not in ERROR_TYPES
          ):
              raise ValueError("invalid diagnostic outcome record")
          sys.stdout.write(
              "\t".join((raw["outcome"], raw["checkpoint"], raw["error_type"])) + "\n"
          )
              ' "${stage}" 2>"${outcome_log}")"; then
              IFS=$'\t' read -r outcome checkpoint error_type <<< "${observation}"
              case "${outcome}" in
                fixture-setup-failed|copied-spec-preflight|copied-spec-generic-failure|expected-classifier|other-known-classifier|unexpected-child-exit)
                  ;;
                *)
                  echo "Windows PyInstaller diagnostic outcome unavailable: ${stage}" >&2
                  DIAGNOSTIC_FAILURE=1
                  return
                  ;;
              esac
              case "${checkpoint}" in
                outer-before-copy|outer-before-create|outer-before-resource-call|outer-before-cause-type|outer-before-winerror-type|outer-before-winerror-value|outer-before-close|outer-before-unlink|outer-complete|parent-before-copied-environment|parent-before-child-launch|parent-before-process-create|parent-after-child-launch|parent-before-result-classification|child-bootstrap|child-import-pyinstaller-api|child-import-pyinstaller-compat|child-import-pyinstaller-exceptions|child-import-pyinstaller-isolated|child-environment|child-share-copy|child-share-create|child-spec-dispatch|child-spec-analysis|child-spec-exe|child-spec-finished|child-before-close|child-before-unlink|child-complete|child-timeout|child-stderr-overflow|child-observer-invalid|child-interpreter-fatal|child-script-parse|child-startup-no-stderr|child-startup-unclassified)
                  ;;
                *)
                  echo "Windows PyInstaller diagnostic outcome unavailable: ${stage}" >&2
                  DIAGNOSTIC_FAILURE=1
                  return
                  ;;
              esac
              case "${error_type}" in
                os-error|file-not-found|file-exists|permission-error|not-a-directory|is-a-directory|import-error|module-not-found|attribute-error|type-error|value-error|runtime-error|assertion-error|system-exit|none|other|unavailable)
                  echo "Windows PyInstaller diagnostic outcome: ${stage}: ${outcome}; checkpoint: ${checkpoint}; error type: ${error_type}"
                  ;;
                *)
                  echo "Windows PyInstaller diagnostic outcome unavailable: ${stage}" >&2
                  DIAGNOSTIC_FAILURE=1
                  ;;
              esac
            else
              echo "Windows PyInstaller diagnostic outcome unavailable: ${stage}" >&2
              DIAGNOSTIC_FAILURE=1
            fi
          }
          run_diagnostic_stage() {
            local stage="$1"
            local node="$2"
            if env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
              "${QUALIFIED_PYTHON}" -m pytest -c "${PYTEST_CONFIG}" \
              --confcutdir=tests/packaging -q "${node}" \
              >"${QUALIFICATION_SETUP_ROOT}/windows-pyinstaller-${stage}.log" 2>&1; then
              echo "Windows PyInstaller diagnostic stage passed: ${stage}"
            else
              echo "Windows PyInstaller diagnostic stage failed: ${stage}" >&2
              DIAGNOSTIC_FAILURE=1
            fi
            read_diagnostic_outcome "${stage}"
          }
          run_diagnostic_stage share-lock \
            "tests/packaging/test_standalone_windows_pyinstaller_diagnostic.py::test_native_share_lock_is_classified_by_the_copied_spec"
          run_diagnostic_stage isolated-child \
            "tests/packaging/test_standalone_windows_pyinstaller_diagnostic.py::test_native_pinned_pyinstaller_classes_are_classified_by_copied_spec[isolated-child]"
          run_diagnostic_stage hook-import \
            "tests/packaging/test_standalone_windows_pyinstaller_diagnostic.py::test_native_pinned_pyinstaller_classes_are_classified_by_copied_spec[hook-import]"
          run_diagnostic_stage python-library \
            "tests/packaging/test_standalone_windows_pyinstaller_diagnostic.py::test_native_pinned_pyinstaller_classes_are_classified_by_copied_spec[python-library]"
          if [[ "${DIAGNOSTIC_FAILURE}" -ne 0 ]]; then
            exit 1
          fi
      - name: Qualify standalone payload
        id: qualify
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          QUALIFICATION_SETUP_ROOT: ${{ steps.qualification-env.outputs.root }}
          WHEEL: ${{ steps.wheel.outputs.wheel-path }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.wheel-sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP}" ]]; then
            echo "runner temporary directory is unavailable" >&2
            exit 1
          fi
          EXPECTED_SETUP_ROOT="${RUNNER_TEMP}/servonaut-qualification-${TARGET}-${GITHUB_RUN_ID}"
          if [[ -z "${QUALIFICATION_SETUP_ROOT}" || "${QUALIFICATION_SETUP_ROOT}" != "${EXPECTED_SETUP_ROOT}" || ! -d "${QUALIFICATION_SETUP_ROOT}" ]]; then
            echo "qualification environment is unavailable" >&2
            exit 1
          fi
          QUALIFICATION_ROOT="${QUALIFICATION_SETUP_ROOT}/work"
          PUBLIC_EVIDENCE="${QUALIFICATION_ROOT}/public-evidence"
          PRODUCT_VERSION="$("${QUALIFIED_PYTHON}" -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          export QUALIFICATION_ROOT
          "${QUALIFIED_PYTHON}" -I -c '
          import os
          from pathlib import Path

          try:
              Path(os.environ["QUALIFICATION_ROOT"]).mkdir(
                  mode=0o700, parents=False, exist_ok=False
              )
          except OSError:
              raise SystemExit("qualification work root could not be created")
          '
          QUALIFICATION_ARGS=(
            --wheel "${WHEEL}" --wheel-sha256 "${WHEEL_SHA256}"
            --target-name "${TARGET}" --product-version "${PRODUCT_VERSION}"
            --build-revision "ci-r${GITHUB_RUN_ATTEMPT}" --source-commit "${GITHUB_SHA}"
            --checkout "${GITHUB_WORKSPACE}" --qualification-root "${QUALIFICATION_ROOT}"
            --public-evidence-dir "${PUBLIC_EVIDENCE}"
          )
          if [[ "${TARGET}" == "linux-x64-ubuntu-22.04" ]]; then
            DOCKER_EXECUTABLE="$(command -v docker)"
            if [[ -z "${DOCKER_EXECUTABLE}" ]]; then
              echo "Docker executable is unavailable" >&2
              exit 1
            fi
            QUALIFICATION_ARGS+=(--docker "${DOCKER_EXECUTABLE}")
          fi
          SOURCE_DATE_EPOCH="$(git -C "${GITHUB_WORKSPACE}" show -s --format=%ct "${GITHUB_SHA}")"
          case "${SOURCE_DATE_EPOCH}" in ''|*[!0-9]*) exit 1;; esac
          export SOURCE_DATE_EPOCH
          if env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -m scripts.standalone_cli.ci_qualify \
            "${QUALIFICATION_ARGS[@]}" \
            >"${QUALIFICATION_SETUP_ROOT}/qualification.stdout" \
            2>"${QUALIFICATION_SETUP_ROOT}/qualification.stderr"; then
            echo "status=passed" >> "${GITHUB_OUTPUT}"
          else
            echo "status=failed" >> "${GITHUB_OUTPUT}"
          fi
      - name: Sanitize public qualification status
        id: sanitize
        if: always() && steps.qualification-env.outputs.root != ''
        shell: bash
        env:
          QUALIFIED_PYTHON: ${{ steps.qualification-env.outputs.python-path }}
          QUALIFICATION_SETUP_ROOT: ${{ steps.qualification-env.outputs.root }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "${RUNNER_TEMP}" ]]; then
            echo "runner temporary directory is unavailable" >&2
            exit 1
          fi
          EXPECTED_SETUP_ROOT="${RUNNER_TEMP}/servonaut-qualification-${TARGET}-${GITHUB_RUN_ID}"
          if [[ "${QUALIFICATION_SETUP_ROOT}" != "${EXPECTED_SETUP_ROOT}" || ! -d "${QUALIFICATION_SETUP_ROOT}" ]]; then
            echo "qualification environment is unavailable" >&2
            exit 1
          fi
          QUALIFICATION_ROOT="${QUALIFICATION_SETUP_ROOT}/work"
          if [[ ! -d "${QUALIFICATION_ROOT}" ]]; then
            echo "qualification work root is unavailable" >&2
            exit 1
          fi
          SOURCE_DIRECTORY="${QUALIFICATION_ROOT}/public-evidence"
          DESTINATION_DIRECTORY="${QUALIFICATION_ROOT}/upload"
          export DESTINATION_DIRECTORY
          "${QUALIFIED_PYTHON}" -I -c '
          import os
          from pathlib import Path

          try:
              Path(os.environ["DESTINATION_DIRECTORY"]).mkdir(
                  mode=0o700, parents=False, exist_ok=False
              )
          except OSError:
              raise SystemExit("qualification upload root could not be created")
          '
          REPORTS=(architecture.json dependency-provenance.json licenses.json manifest.json missing-baseline-candidate.json sbom-payload.cdx.json sbom-python-closure.cdx.json sizes.json warning-candidates.json warnings.json qualification-status.json)
          MANDATORY_REPORTS=(architecture.json dependency-provenance.json licenses.json manifest.json sbom-payload.cdx.json sbom-python-closure.cdx.json sizes.json warning-candidates.json warnings.json qualification-status.json)
          for NAME in "${REPORTS[@]}"; do
            SOURCE="${SOURCE_DIRECTORY}/${NAME}"
            DESTINATION="${DESTINATION_DIRECTORY}/${NAME}"
            if [[ ! -f "${SOURCE}" ]]; then continue; fi
            SOURCE="${SOURCE}" DESTINATION="${DESTINATION}" \
            env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE -u PIP_CONFIG_FILE \
            "${QUALIFIED_PYTHON}" -c '
          import os
          from pathlib import Path
          from scripts.standalone_cli.evidence_policy import load_evidence_policy
          from scripts.standalone_cli.evidence_sanitize import load_bounded_json, write_public_json
          source = Path(os.environ["SOURCE"])
          destination = Path(os.environ["DESTINATION"])
          forbidden_roots = (
              Path(os.environ["QUALIFICATION_SETUP_ROOT"]),
              Path(os.environ["GITHUB_WORKSPACE"]),
              Path.home(),
          )
          maximum = load_evidence_policy(Path("packaging/standalone_cli/evidence-policy.json")).limits.max_metadata_file_bytes
          document = load_bounded_json(source, "qualification report", maximum)
          write_public_json(destination, document, forbidden_roots=forbidden_roots, max_bytes=maximum)
          '
          done
          if [[ "${{ steps.qualify.outputs.status }}" == "passed" ]]; then
            for NAME in "${MANDATORY_REPORTS[@]}"; do test -f "${DESTINATION_DIRECTORY}/${NAME}"; done
          fi
      - name: Upload sanitized qualification status
        id: upload
        if: always() && steps.qualification-env.outputs.root != '' && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-qualification-${{ matrix.target }}
          path: |
            ${{ steps.qualification-env.outputs.root }}/work/upload/architecture.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/dependency-provenance.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/licenses.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/manifest.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/missing-baseline-candidate.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/sbom-payload.cdx.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/sbom-python-closure.cdx.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/sizes.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/warning-candidates.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/warnings.json
            ${{ steps.qualification-env.outputs.root }}/work/upload/qualification-status.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
      - name: Cleanup qualification material
        id: cleanup
        if: always()
        shell: bash
        env:
          QUALIFICATION_SETUP_ROOT: ${{ steps.qualification-env.outputs.root }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EXPECTED_SETUP_ROOT="${RUNNER_TEMP}/servonaut-qualification-${TARGET}-${GITHUB_RUN_ID}"
          WHEEL_ROOT="${RUNNER_TEMP}/servonaut-wheel-${TARGET}-${GITHUB_RUN_ID}"
          CLEANUP_FAILED=0
          if [[ -n "${QUALIFICATION_SETUP_ROOT}" ]]; then
            if [[ "${QUALIFICATION_SETUP_ROOT}" == "${EXPECTED_SETUP_ROOT}" ]]; then
              rm -rf "${QUALIFICATION_SETUP_ROOT}"
            else
              echo "qualification environment path is invalid" >&2
              CLEANUP_FAILED=1
            fi
          fi
          rm -rf "${WHEEL_ROOT}"
          exit "${CLEANUP_FAILED}"
      - name: Require successful qualification
        if: always()
        shell: bash
        run: |
          test "${{ steps.qualify.outputs.status }}" = passed
          test "${{ steps.sanitize.outcome }}" = success
          test "${{ steps.upload.outcome }}" = success
          test "${{ steps.cleanup.outcome }}" = success
