[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servonaut"
version = "2.23.2"
description = "Manage AWS, Hetzner, OVH, and custom servers from one TUI — with a built-in AI assistant and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3",
    "tabulate",
    "textual>=8.0.0",
    "cryptography>=42.0",
    "bcrypt>=3.2",
    "pynacl>=1.5",
    "httpx>=0.25.0",
    "httpx-sse>=0.4",
    "keyring>=24",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.3",
]
mcp = ["mcp>=1.0.0"]
ovh = ["ovh"]
hetzner = ["hcloud>=2.0"]
# Deprecated aliases kept for compatibility — deps are now required.
ai = []
sync = []
keyring = []
all = ["mcp>=1.0.0", "ovh", "hcloud>=2.0", "keyring>=24"]

[project.urls]
Homepage = "https://github.com/zb-ss/ec2-ssh"
Repository = "https://github.com/zb-ss/ec2-ssh"
Issues = "https://github.com/zb-ss/ec2-ssh/issues"

[project.scripts]
servonaut = "servonaut.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servonaut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Cap any single test at 60 seconds. The slowest legitimate tests in the
# suite (memory probers exercising 7 × 5 s SDK timeouts) finish in ~35 s,
# so a 60 s ceiling catches infinite hangs without flaking valid tests.
timeout = 60
timeout_method = "thread"
